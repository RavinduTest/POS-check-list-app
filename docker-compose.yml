# Local development: both apps + Firebase emulators (no real Firebase project needed).
#   docker compose up --build
#   Back office  http://localhost:3000   (login: admin / ChangeMe123, change password on first login in the mobile app or reset it)
#   Mobile (web) http://localhost:8081
#   Emulator UI  http://localhost:4000
#
# Production: build the apps with real Firebase values, e.g.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up --build -d
services:
  firebase:
    build: ./firebase
    environment:
      FIRESTORE_EMULATOR_HOST: localhost:8080
      FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
      GCLOUD_PROJECT: demo-serp-pos
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
    ports: ["4000:4000", "8080:8080", "9099:9099", "5001:5001", "9199:9199"]

  backoffice:
    build:
      context: ./backoffice
      args:
        NEXT_PUBLIC_USE_EMULATORS: "true"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-serp-pos
    ports: ["3000:3000"]
    depends_on: [firebase]

  mobile-web:
    build:
      context: ./mobile
      args:
        USE_EMULATORS: "true"
        FIREBASE_PROJECT_ID: demo-serp-pos
    ports: ["8081:80"]
    depends_on: [firebase]

